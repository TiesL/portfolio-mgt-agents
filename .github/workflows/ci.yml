name: CI

# Runs on pull requests and on pushes to main.
#
# `pull_request` judges the merged result — head merged into base — not
# just the branch on its own. That is exactly the case where two
# individually green branches can break together. It is also the form you
# can set as a required check on a pull request, so the form that can
# actually block a merge.
#
# `push: branches: [main]` is the backstop: if a commit ever lands on main
# that did not come from a pull request, it still gets checked.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # Without this block the job gets the adopted project's default,
    # minimal token scope — no pull-requests:read. "PR references issue"
    # (link 3, hard block) calls `gh pr view --json closingIssuesReferences`
    # and needs that scope. contents:read is explicit here too: as soon as
    # one permission is named, the implicit default for the rest no longer
    # applies. issues:read: closingIssuesReferences is about the linked
    # issue itself, not the PR — without it the query silently returns an
    # empty list even when the link genuinely exists.
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      # No npm/setup-node step: this repo has no package.json, and `check`
      # is a plain executable shell script, not an npm script. A project
      # whose own `check` shells out to npm/another toolchain is
      # responsible for making that available itself.
      - run: ./check
      - name: PR references issue (link 3)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./check-pr-issue-link.sh "${{ github.event.pull_request.number }}"
      - name: Commit on main comes from a PR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./check-main-via-pr.sh "${{ github.sha }}"
